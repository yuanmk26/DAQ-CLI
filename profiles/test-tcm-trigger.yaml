# 真机联调配置：4 块 ADC（.10/.12/.13/.14）+ TCM（192.168.10.16）
# 四块板 ch0 均接负脉冲塑闪；M21 → TCM: dev1=ch0, dev2=ch1, dev3=ch2, dev4=ch3
# 目标触发: (dev1|dev2) AND (dev3|dev4)

devices:
  dev1:
    ip: 192.168.10.10
    rbcp_port: 4660
    tcp_port: 24
    board_id: 0
    role: adc

  dev2:
    ip: 192.168.10.12
    rbcp_port: 4660
    tcp_port: 24
    board_id: 1
    role: adc

  dev3:
    ip: 192.168.10.13
    rbcp_port: 4660
    tcp_port: 24
    board_id: 2
    role: adc

  dev4:
    ip: 192.168.10.14
    rbcp_port: 4660
    tcp_port: 24
    board_id: 3
    role: adc

tcm:
  main:
    ip: 192.168.10.16
    rbcp_port: 4660

groups:
  two_board:
    devices: [dev1, dev2]
    tcm: main
  four_board:
    devices: [dev1, dev2, dev3, dev4]
    tcm: main

defaults:
  output_dir: out
  adc_length: 64
  acquire_multi:
    aggregation_key: timestamp
    timestamp_match_window_ticks: 10
    event_timeout_ms: 50
    tcp_timeout_s: 1.0
    allow_start_without_ack: true
    outputs:
      raw:
        enabled: true
        dir: out/test_raw
      json:
        enabled: true
        dir: out/test_json
      text:
        enabled: false
      log:
        enabled: true
        dir: out/test_log

legacy:
  project_root: E:\projects\1-hardware\FDU-ADC-250M-16ch

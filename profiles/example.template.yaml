devices:
  dev1:
    ip: 192.168.10.10  # change for your lab network
    rbcp_port: 4660
    tcp_port: 24
    board_id: 0
    role: adc

  dev2:
    ip: 192.168.10.11  # change for your lab network
    rbcp_port: 4660
    tcp_port: 24
    board_id: 1
    role: adc

tcm:
  main:
    ip: 192.168.10.20  # change for your TCM
    rbcp_port: 4660

groups:
  two_board:
    devices: [dev1, dev2]
    tcm: main

defaults:
  adc_length: 64
  output_dir: out
  trigger_mode: 1
  trigger_position: 40
  thresholds: [1950, 2400, 2300, 2300]
  acquire_single:
    events: 1000
    timeout_s: 10.0
    progress_every: 50
    watch_every: 50
    outputs:
      raw:
        enabled: true
        dir: out/raw
      json:
        enabled: true
        dir: out/json
      text:
        enabled: false
        dir: out/text
        max_events_per_file: 100
        waveform_layout: point_rows
      log:
        enabled: false
        dir: out/log
  acquire_multi:
    aggregation_key: timestamp
    timestamp_match_window_ticks: 10
    event_timeout_ms: 50
    tcp_timeout_s: 1.0
    allow_start_without_ack: true
    watch_waveforms: true
    watch_every: 100
    stop_on_watch_close: true
    outputs:
      raw:
        enabled: true
        dir: out/multi_raw
      json:
        enabled: true
        dir: out/multi_json
      text:
        enabled: false
        dir: out/multi_text
        max_events_per_file: 100
        waveform_layout: point_rows
      log:
        enabled: true
        dir: out/multi_log
